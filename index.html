<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Earthquake Monitor v2</title>

    <link
        rel="stylesheet"
        href="style.css">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header>

        <h1>🌏 Earthquake Monitor</h1>

        <p>
            日本のリアルタイム地震モニター
        </p>

    </header>

    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main>

        <!-- 更新情報 -->

        <section class="status">

            <div>

                最終更新

                <span id="lastUpdate">
                    接続中...
                </span>

            </div>

            <div id="connectionStatus">
                🟢 WebSocket接続中
            </div>

        </section>

        <!-- 地図 + サイド -->

        <section class="main-layout">

            <!-- ========================= -->
            <!-- Map -->
            <!-- ========================= -->

            <section class="map-panel">

                <div id="japanMap"></div>

            </section>

            <!-- ========================= -->
            <!-- Sidebar -->
            <!-- ========================= -->

            <aside class="sidebar">

                <!-- 到達予測 -->

                <section class="card">

                    <h2>
                        🏠 到達予測
                    </h2>

                    <div id="arrivalInfo">

                        地震を待っています...

                    </div>

                </section>

                <!-- 自宅 -->

                <section class="card">

                    <h2>
                        📍 自宅位置
                    </h2>

                    <p>

                        地図をクリックすると
                        自宅位置を設定できます。

                    </p>

                    <label>

                        緯度

                        <input
                            id="homeLat"
                            type="number"
                            step="0.000001">

                    </label>

                    <label>

                        経度

                        <input
                            id="homeLon"
                            type="number"
                            step="0.000001">

                    </label>

                    <button id="saveHome">

                        保存

                    </button>

                </section>

                <!-- 最新地震 -->

                <section class="card latest">

                    <h2>

                        📋 最新地震

                    </h2>

                    <div id="earthquakeList">

                        <div class="loading">

                            地震情報取得中...

                        </div>

                    </div>

                </section>

            </aside>

        </section>

    </main>

    <!-- ========================= -->
    <!-- 緊急通知 -->
    <!-- ========================= -->

    <div
        id="notification"
        class="hidden">

        <div id="notificationTitle">

            緊急地震速報

        </div>

        <div id="notificationBody">

        </div>

    </div>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer>

        Earthquake Monitor v2

    </footer>

    <!-- ========================= -->
    <!-- Scripts -->
    <!-- ========================= -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="arrival.js"></script>

    <script src="wave.js"></script>

    <script src="notification.js"></script>

    <script src="map.js"></script>

    <script src="websocket.js"></script>

    <script src="app.js"></script>

</body>

</html>
